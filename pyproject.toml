[project]
name = "biblio-hub"
version = "0.2.0"
description = "Integrated Python bibliometric analysis platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Biblio-HUB Team"}
]
keywords = ["bibliometrics", "science-mapping", "network-analysis", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "streamlit>=1.20.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "networkx>=2.8",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
    "pyvis>=0.3.2",
    "python-louvain>=0.16",
    "wordcloud>=1.8.0",
    "scikit-learn>=1.0.0",
    "kaleido>=0.2.1",
]

[project.optional-dependencies]
topic-modeling = [
    "sentence-transformers>=2.0.0",
    "umap-learn>=0.5.0",
    "hdbscan>=0.8.0",
    "bertopic>=0.16.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
biblio-hub = "app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402", "F401"]
"modules/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyvis.*"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
