[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    -q
markers =
    slow: marks tests that are slow to run
    smoke: marks smoke tests for CI/CD
    experiment: marks tests related to experiment framework
    export: marks tests related to export bundle
    keyword: marks tests related to keyword pipeline
    network: marks tests related to network layouts
